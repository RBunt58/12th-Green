<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>12th Green</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green-deep: #1B3A2D;
    --green-mid:  #2C5440;
    --sand:       #C9A84C;
    --sand-light: #E8D08A;
    --white:      #FFFFFF;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }

  /* ── NAVIGATION ─────────────────────────────────────────── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(27, 58, 45, 0.97);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(201, 168, 76, 0.3);
  }

  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
  }

  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 1.4rem;
    color: var(--sand);
    letter-spacing: 0.02em;
    text-decoration: none;
  }

  .nav-links {
    display: flex;
    list-style: none;
    gap: 0.25rem;
  }

  .nav-links a {
    display: block;
    padding: 0.5rem 0.85rem;
    color: rgba(255,255,255,0.8);
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-radius: 4px;
    transition: color 0.2s, background 0.2s;
  }

  .nav-links a:hover {
    color: var(--sand-light);
    background: rgba(201, 168, 76, 0.12);
  }

  /* ── HERO ───────────────────────────────────────────────── */
  .hero {
    height: 100vh;
    background:
      linear-gradient(to bottom, rgba(27,58,45,0.72) 0%, rgba(27,58,45,0.45) 50%, rgba(27,58,45,0.82) 100%),
      url('images/golf_green_hero.png') center center / cover no-repeat;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent,
      transparent 3px,
      rgba(255,255,255,0.012) 3px,
      rgba(255,255,255,0.012) 4px
    );
    pointer-events: none;
  }

  .hero-flag {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--sand);
    border: 1px solid rgba(201, 168, 76, 0.5);
    padding: 0.35rem 1rem;
    border-radius: 2px;
    margin-bottom: 2rem;
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3.5rem, 10vw, 8rem);
    font-weight: 700;
    font-style: italic;
    color: var(--white);
    line-height: 0.9;
    letter-spacing: -0.02em;
    margin-bottom: 1.5rem;
  }

  .hero-title span {
    color: var(--sand);
    display: block;
  }

  .hero-sub {
    font-size: 1.05rem;
    font-weight: 300;
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 3rem;
  }

  .btn-primary {
    display: inline-block;
    padding: 0.85rem 2rem;
    border-radius: 3px;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    background: var(--sand);
    color: var(--green-deep);
    border: 2px solid var(--sand);
    transition: all 0.25s;
  }

  .btn-primary:hover {
    background: var(--sand-light);
    border-color: var(--sand-light);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(201,168,76,0.35);
  }
</style>
</head>
<body>

<!-- NAVIGATION -->
<nav>
  <div class="nav-inner">
    <a href="javascript:void(0)" onclick="window.location='index.html'" class="nav-logo">12th-Green</a>
    <ul class="nav-links">
      <li><a href="javascript:void(0)" onclick="window.location='index.html'">Home</a></li>
      <li><a href="javascript:void(0)" onclick="window.location='contact/contact.htm'">Contact</a></li>
    </ul>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-flag">Welcome to</div>
  <h1 class="hero-title">
    12th<span>Green</span>
  </h1>
  <p class="hero-sub">Where every round tells a story</p>
  <a href="javascript:void(0)" onclick="window.location='contact/contact.htm'" class="btn-primary">Get in Touch</a>
</div>

</body>
</html>
